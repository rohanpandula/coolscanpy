name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.30"
          python-version: ${{ matrix.python-version }}
          enable-cache: false

      - name: Install dependencies
        # No --all-extras: the optional `scanner` extra (python-sane) is a
        # source-only distribution that compiles against system libsane
        # headers, which these runners don't have. The suite is
        # hardware-free and never imports it for real (SANE-touching tests
        # fake sys.modules["sane"]), so it isn't needed here.
        run: uv sync --frozen --dev

      - name: Run tests
        run: uv run --frozen pytest -q

      - name: Run ruff
        run: uv run --frozen ruff check .
