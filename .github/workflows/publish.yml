name: Publish to PyPI

# Trusted publishing (OIDC): no API token is stored or entered anywhere.
# Publishing coolscanpy is triggered by pushing a version tag (e.g. v0.5.0)
# once the matching PyPI trusted publisher is configured for this repo +
# workflow. The build is gated on the test suite, and the tag must equal the
# pyproject version so a mistyped tag can never publish the wrong release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.13"
      - run: uv sync --frozen --dev
      - run: uv run --frozen pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for PyPI trusted publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.13"
      - name: Tag must equal pyproject version
        run: |
          version="$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi
      - name: Build sdist + wheel
        run: uv build --no-sources --clear
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
