name: Publish to PyPI

# Trusted publishing (OIDC): no API token is stored or entered anywhere.
# Publishing coolscanpy is triggered by pushing a version tag (e.g. v0.5.0)
# once the matching PyPI trusted publisher is configured for this repo +
# workflow. The build is gated on the test suite, and the tag must equal the
# pyproject version so a mistyped tag can never publish the wrong release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.30"
          python-version: "3.13"
          enable-cache: false
      - name: Tag target must be merged into the release branch
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/port/cross-platform:refs/remotes/origin/port/cross-platform
          if ! git merge-base --is-ancestor \
            "$GITHUB_SHA" refs/remotes/origin/port/cross-platform; then
            echo "tag target is not merged into port/cross-platform" >&2
            exit 1
          fi
      - run: uv sync --frozen --dev
      - run: uv run --frozen pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for PyPI trusted publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.30"
          python-version: "3.13"
          enable-cache: false
      - name: Install the locked build backend
        run: uv sync --frozen --dev
      - name: Tag must equal pyproject version
        run: |
          version="$(uv run --frozen python - <<'PY'
          import tomllib
          from pathlib import Path

          print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])
          PY
          )"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi
      - name: Build sdist + wheel
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/dist"
          uv build \
            --no-sources \
            --no-build-isolation \
            --out-dir "$RUNNER_TEMP/dist"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: ${{ runner.temp }}/dist/
